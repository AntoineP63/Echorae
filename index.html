<style>
/* Layout: one-screen app, script column in the middle, tab bar at the bottom; rehearsal opens a dark "plateau" overlay */

  --accent:#F0A43A; --accent-ink:#1C1300; --lamp:#F2B036; --danger:#F2847C; --chl:72%;
  --stage:#0A0C11; --stage-ink:#F1EEE6; --stage-muted:#858C9C; color-scheme:dark }
html{box-sizing:border-box;height:100%}

body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}

.recbtn{width:72px;height:72px;border-radius:50%;border:3px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}

/* Stage overlay */
.stage{position:fixed;inset:0;z-index:40;background:var(--stage);color:var(--stage-ink);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.stage .top{display:flex;justify-content:space-between;align-items:center;padding-block:12px;gap:10px;font-size:12px;color:var(--stage-muted);letter-spacing:.08em;text-transform:uppercase}

.hidden-text{letter-spacing:.3em;color:var(--stage-muted)}
.bar{height:6px;border-radius:3px;background:#2A2F3B;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lamp)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:18px;padding-block:14px 18px}
.cbtn{all:unset;cursor:pointer;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid #333A48;color:var(--stage-ink)}

<script>
"use strict";
/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const words = t => (t || "").split(/\s+/).filter(Boolean).length;
const HUES = [8, 205, 140, 280, 38, 330, 95, 240, 175, 20];

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
const DB = {
  db: null, mem: { plays: new Map(), audio: new Map() },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("souffleur", 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("plays", { keyPath: "id" }); d.createObjectStore("audio"); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r ? r.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  async get(s, k) { if (this.db) try { return await this.req(s, "readonly", st => st.get(k)); } catch (e) {} return this.mem[s].get(k); },
  async put(s, v, k) { this.mem[s].set(k ?? v.id, v); if (this.db) try { await this.req(s, "readwrite", st => k === undefined ? st.put(v) : st.put(v, k)); } catch (e) {} },
  async del(s, k) { this.mem[s].delete(k); if (this.db) try { await this.req(s, "readwrite", st => st.delete(k)); } catch (e) {} },
  async all(s) { if (this.db) try { return await this.req(s, "readonly", st => st.getAll()); } catch (e) {} return [...this.mem[s].values()]; },
  async keys(s) { if (this.db) try { return await this.req(s, "readonly", st => st.getAllKeys()); } catch (e) {} return [...this.mem[s].keys()]; }
};

/* ---------- parser: text -> répliques / didascalies ---------- */
const UP = "A-ZÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŸŒÆ";
const SPK = new RegExp(`^((?:M\\.|MME|MLLE|Mme|Mlle|Me)\\s*)?([${UP}][${UP}'’\\- ]*[${UP}])(?:\\s*([.:,])\\s*(.*))?$`, "u");
const STOP = /^(ACTE|SC[ÈE]NE|FIN|RIDEAU|PERSONNAGES|ENTRACTE|PROLOGUE|[ÉE]PILOGUE|TABLEAU|CHAPITRE|NOIR)\b/;
const HEAD = /^(ACTE|SC[ÈE]NE|TABLEAU|PROLOGUE|[ÉE]PILOGUE|ENTRACTE)\b/i;
const BLACK = /^(NOIR|RIDEAU|FIN)\b/;
const GROUP = /^(ENSEMBLE|TOUS|TOUTES|CH[ŒO]EUR)\b/;
const fold = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();

function speakerOf(line) {
  let paren = "";
  const pm = line.match(/^(.*?\S)\s*\(([^)]*)\)\s*$/);
  if (pm && new RegExp(`^[${UP}'’\\-. ]+$`, "u").test(pm[1])) { line = pm[1]; paren = pm[2].trim(); }
  const m = line.match(SPK); if (!m) return null;
  const core = m[2].replace(/\s+/g, " ").trim();
  if (STOP.test(core)) return null;
  if ((core.match(/[A-Za-zÀ-ÿŒœÆæ]/g) || []).length < 2) return null;
  if (core.split(" ").length > 4) return null;
  const name = ((m[1] || "").toUpperCase().replace(/\s+/g, " ") + core).trim();
  return { name, sep: m[3] || "", rest: (m[4] || "").trim(), paren };
}

function parseText(raw) {
  let lines = raw.replace(/ /g, " ").split(/\r?\n/).map(l => l.replace(/\s+/g, " ").trim()).filter(l => !/^\d{1,4}$/.test(l));
  const firstHead = lines.findIndex(l => HEAD.test(l) && l.length < 70);
  const preface = firstHead > 0 ? lines.slice(0, firstHead).filter(Boolean) : [];
  if (firstHead > 0) lines = lines.slice(firstHead);
  const counts = {}, alone = {};
  lines.forEach(l => { const s = speakerOf(l); if (s) { counts[s.name] = (counts[s.name] || 0) + 1; if (!s.sep) alone[s.name] = 1; } });
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const set = new Set(Object.keys(counts).filter(n => counts[n] >= 2 || total < 6 || (alone[n] && total > 20 && n.split(" ").length <= 2)));

  const blocks = []; let cur = null, inParen = false, lastWho = "";
  const push = (type, who, text) => { cur = { id: uid(), type, who: who || "", text }; blocks.push(cur); return cur; };
  const append = t => {
    if (/[A-Za-zÀ-ÿ]-$/.test(cur.text) && /^[a-zà-ÿ]/.test(t)) cur.text = cur.text.slice(0, -1) + t;
    else cur.text += (cur.text ? " " : "") + t;
  };
  if (preface.length) push("didasc", "", preface.join(" — ")), cur = null;
  for (const l of lines) {
    if (!l) { if (cur && cur.type !== "line") cur = null; continue; }
    if (inParen) { append(l); if (l.includes(")")) { inParen = false; cur = null; } continue; }
    if (HEAD.test(l) && l.length < 70) { push("heading", "", l); cur = null; lastWho = ""; continue; }
    if (BLACK.test(l) && l.length < 40) { push("didasc", "", l.charAt(0) + l.slice(1).toLowerCase()); cur = null; lastWho = ""; if (/\bFIN\b/.test(l)) break; continue; }
    const s = speakerOf(l);
    if (s && set.has(s.name)) {
      if (s.sep === "," && [...set].some(n => n !== s.name && s.rest.startsWith(n))) { push("didasc", "", l); cur = null; lastWho = ""; continue; }
      let name = s.name;
      if (s.paren) {
        const real = [...set].find(n => fold(n) === fold(s.paren));
        if (real) { push("didasc", real, s.name.charAt(0) + s.name.slice(1).toLowerCase()); name = real; }
        else push("didasc", name, s.paren);
      }
      lastWho = name; let rest = s.rest;
      if (s.sep === "," && rest) {
        const m = rest.match(/^(.*?)(?:\.\s*—\s*|\s—\s*|\.\s+(?=[A-ZÀ-Ý«]))(.*)$/);
        if (m) { push("didasc", name, m[1].trim()); rest = m[2]; }
        else { push("didasc", name, rest.replace(/\.$/, "")); rest = ""; }
      }
      push("line", name, rest.replace(/^—\s*/, ""));
      continue;
    }
    if (l.startsWith("(")) {
      const close = l.indexOf(")");
      if (close < 0) { push("didasc", lastWho, l); inParen = true; continue; }
      push("didasc", lastWho, l.slice(0, close + 1)); cur = null;
      const rest = l.slice(close + 1).trim();
      if (rest) { if (lastWho) push("line", lastWho, rest); else push("didasc", "", rest); }
      continue;
    }
    if (cur && (cur.type === "line" || cur.type === "didasc")) { append(l); continue; }
    if (!lastWho) {
      for (let j = blocks.length - 1; j >= 0 && blocks[j].type === "didasc"; j--) {
        const f = " " + fold(blocks[j].text).replace(/[^A-Z]+/g, " ") + " ";
        const hit = [...set].find(n => !GROUP.test(n) && f.includes(" " + fold(n) + " "));
        if (hit) { lastWho = hit; break; }
      }
    }
    if (lastWho) push("line", lastWho, l); else push("didasc", "", l);
  }
  const out = [];
  for (const b of blocks) {
    if (b.type !== "line") { out.push(b); continue; }
    for (const p of b.text.split(/(\([^)]*\))/)) {
      const t = p.trim(); if (!t || !/[\p{L}\d]/u.test(t)) continue;
      out.push({ id: uid(), type: /^\(.*\)$/.test(t) ? "didasc" : "line", who: b.who, text: t });
    }
  }
  out.forEach(b => { if (b.type === "didasc") b.text = b.text.replace(/^\(\s*/, "").replace(/\s*\)\.?$/, ""); });
  const merged = [];
  for (const b of out.filter(b => b.text && b.text.trim())) {
    const l = merged[merged.length - 1];
    if (l && l.type === "didasc" && b.type === "didasc" && l.who === b.who && !/^(Noir|Rideau|Fin)\b/.test(l.text)) l.text += " " + b.text;
    else merged.push(b);
  }
  return merged;
}

/* ---------- PDF -> text ---------- */
/* Italic runs become "(…)" so the parser treats them as didascalies; lines repeated on most pages (headers, footers) are dropped. */
async function pdfToText(file) {
  if (!window.pdfjsLib) throw new Error("Le lecteur PDF n'a pas pu se charger. Vérifie ta connexion puis recharge la page.");
  const data = file.arrayBuffer ? new Uint8Array(await file.arrayBuffer()) : file;
  const pdf = await pdfjsLib.getDocument({ data, isEvalSupported: false, disableFontFace: true }).promise;
  const pages = []; let chars = 0;
  const renderLine = segs => {
    const runs = [];
    for (const sg of segs) { const l = runs[runs.length - 1]; if (l && l.it === sg.it) l.t += sg.t; else runs.push({ ...sg }); }
    return runs.map(r => r.it && /[\p{L}]/u.test(r.t) ? "(" + r.t.replace(/[()]/g, "").trim() + ")" : r.t.trim()).filter(Boolean).join(" ");
  };
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    try { await page.getOperatorList(); } catch (e) {}
    const tc = await page.getTextContent();
    const fonts = {};
    const isIt = fn => { if (!(fn in fonts)) { let n = ""; try { n = page.commonObjs.get(fn).name || ""; } catch (e) {} fonts[fn] = /italic|oblique/i.test(n); } return fonts[fn]; };
    const lines = []; let segs = [], lastY = null, lastEnd = null, lastH = 12;
    const flush = () => { if (segs.some(s => s.t.trim())) lines.push({ t: renderLine(segs), y: lastY, h: lastH }); segs = []; lastEnd = null; };
    for (const it of tc.items) {
      if (!("str" in it)) continue;
      if (!it.str) { if (it.hasEOL) flush(); continue; }
      const x = it.transform[4], y = it.transform[5], h = Math.abs(it.transform[3]) || it.height || 12;
      if (lastY !== null && Math.abs(y - lastY) > h * 0.5) flush();
      let t = it.str;
      if (lastEnd !== null && x - lastEnd > h * 0.15 && !t.startsWith(" ") && !segs[segs.length - 1]?.t.endsWith(" ")) t = " " + t;
      segs.push({ t, it: isIt(it.fontName) }); lastY = y; lastEnd = x + (it.width || 0); lastH = h;
      if (it.hasEOL) flush();
    }
    flush();
    lines.forEach(l => chars += l.t.length);
    pages.push(lines);
  }
  const norm = t => t.replace(/[()]/g, "").replace(/\d+/g, "#").replace(/\s+/g, " ").trim();
  const seen = {};
  pages.forEach(ls => new Set([...ls.slice(0, 3), ...ls.slice(-3)].map(l => norm(l.t))).forEach(k => seen[k] = (seen[k] || 0) + 1));
  const rep = new Set(Object.keys(seen).filter(k => seen[k] >= Math.max(3, pages.length * 0.4)));
  const out = [];
  pages.forEach(ls => {
    const keep = ls.filter(l => !rep.has(norm(l.t)) && !/^#\s*[-/]\s*#$|^#$/.test(norm(l.t)));
    keep.forEach((ln, i) => {
      if (i && keep[i - 1].y != null && ln.y != null && keep[i - 1].y - ln.y > ln.h * 1.9) out.push("");
      out.push(ln.t);
    });
  });
  return { text: out.join("\n"), pages: pdf.numPages, chars };
}

        const set = new Set(cp.blocks.filter(b => b.type === "line").map(norm));
        if (lines.length && lines.filter(b => set.has(norm(b))).length / lines.length >= 0.8) { target = cp; break; }
      }
      let created = false;
      if (!target) {
        target = { id: uid(), title: lp.title, blocks: JSON.parse(JSON.stringify(lp.blocks)), created: Date.now(), updated: Date.now(), cloud: true, pending: true, created_by: U.me.id };
        target.loadedAt = target.updated; target.settings = settingsFor(target.id, lp.settings);
        S.plays.unshift(target); await queue(() => cloudWrite(target)); created = true;
      }
      LS.set("set:" + target.id, { ...settingsFor(target.id), ...(lp.settings || {}) }); target.settings = settingsFor(target.id);
      const existing = new Set(chk(await sb.from("voices").select("block_id").eq("play_id", target.id)).map(r => r.block_id));
      const used = new Set();
      for (const k of [...S.localRec].filter(k => k.startsWith(lp.id + ":"))) {
        const lb = lp.blocks.find(b => b.id === k.slice(lp.id.length + 1)); if (!lb) continue;
        const tb = created ? target.blocks.find(b => b.id === lb.id) : target.blocks.find(b => b.type === "line" && !used.has(b.id) && norm(b) === norm(lb));
        if (!tb || existing.has(tb.id)) continue; used.add(tb.id);
        const blob = await DB.get("audio", k); if (!blob) continue;
        S.msg = { t: `Envoi des voix de « ${lp.title} » (${voices + 1})…` }; render();
        await saveAudio(tb, blob, target); voices++;
      }
      LS.set("migrated:" + lp.id, true); plays++;
      S.local = S.local.filter(x => x !== lp);
    }
    S.msg = { t: `C'est fait : ${plays} pièce${plays > 1 ? "s" : ""} et ${voices} voix sont maintenant partagées avec la troupe.` };
  } catch (e) { S.msg = { err: true, t: "L'envoi s'est arrêté : " + errText(e) + " Relance-le pour continuer, ce qui est déjà envoyé ne sera pas dupliqué." }; }
  watchAudio(S.play); render();
}

/* ---------- timeline de départ ---------- */
function spokenIdx() { const out = []; S.play.blocks.forEach((b, i) => { if (b.type === "line") out.push(i); }); return out; }
function isMine(b) { return b.type === "line" && (b.who === S.play.settings.me || GROUP.test(b.who)); }
function startBlockIdx() {
  const s = S.play.settings, bl = S.play.blocks;
  if (s.startId) { const i = bl.findIndex(b => b.id === s.startId); if (i >= 0) return i; }
  return Math.min(+s.start || 0, bl.length - 1);
}
function tlPos(L) { const si = startBlockIdx(); let p = L.findIndex(i => i >= si); return p < 0 ? 0 : p; }
function shortScene(t) {
  const m = fold(t).match(/ACTE\s+([IVXL\d]+).*?SCENE\s+([IVXL\d]+|PREMIERE)/);
  return m ? m[1] + "·" + (m[2] === "PREMIERE" ? "1" : m[2]) : t.slice(0, 8);
}
function tlPreview(pos) {
  const L = spokenIdx(), i = L[pos], b = S.play.blocks[i]; if (!b) return "";
  const mine = isMine(b), el = $("#tlPrev"); if (!el) return;
  const nMine = L.slice(0, pos + 1).filter(j => isMine(S.play.blocks[j])).length;
  el.className = "tl-prev" + (mine ? " mine" : "");
  el.innerHTML = `<div class="meta"><span>${esc(sceneOf(i))}</span><span>Réplique ${pos + 1}/${L.length}</span></div>
    <div class="txt2"><span class="who" style="${cstyle(b.who)}">${esc(b.who)}.</span>${esc(b.text)}</div>
    <div class="meta"><span>${mine ? "Ta réplique n° " + nMine : nMine ? nMine + " de tes répliques avant ce point" : "Avant ta première réplique"}</span><button class="btn ghost" data-act="tlEdit" style="padding:2px 6px">Modifier</button></div>`;
}
function drawTimeline() {
  const cv = $("#tlCanvas"); if (!cv || !S.play) return;
  const L = spokenIdx(), bl = S.play.blocks, n = L.length; if (!n) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const g = cv.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  const cs = getComputedStyle(document.documentElement), col = v => cs.getPropertyValue(v).trim();
  const x = p => n === 1 ? w / 2 : 3 + p * (w - 6) / (n - 1);
  g.fillStyle = col("--bg"); g.fillRect(0, 20, w, h - 20);
  /* scenes */
  g.font = "600 10px " + col("--f-ui"); g.textBaseline = "top"; let lastLabel = -99;
  bl.forEach((b, i) => {
    if (b.type !== "heading") return;
    let p = L.findIndex(j => j > i); if (p < 0) p = n - 1;
    const xx = Math.round(x(p)) + 0.5;
    g.fillStyle = col("--muted"); g.fillRect(xx - 0.5, 14, 1, h - 14);
    if (xx - lastLabel > 34) { g.fillText(shortScene(b.text), Math.min(xx + 3, w - 30), 2); lastLabel = xx; }
  });
  /* lines */
  L.forEach((i, p) => {
    const b = bl[i], mine = isMine(b), xx = x(p);
    g.fillStyle = mine ? col("--accent") : col("--line");
    if (mine) g.fillRect(xx - 1, 22, 2.5, h - 24); else g.fillRect(xx - 0.5, h - 18, 1, 16);
  });
}
function setTlPos(pos) {
  const L = spokenIdx(); pos = Math.max(0, Math.min(L.length - 1, pos));
  const r = $("#tlRange"); if (r) r.value = pos;

const player = new Audio();

  next: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',

      <div class="mid"><div class="cur head">Rideau</div><div class="note" style="text-align:center;color:var(--stage-muted)">Bravo. Tu peux recommencer ou changer de scène dans l'onglet Répéter.</div></div><div class="ctrl"></div>`;
    return;
  }
  const mine = b.type === "line" && (b.who === s.me || GROUP.test(b.who));

      const L = spokenIdx(), i = L[+$("#tlRange").value];
      S.tab = "piece"; S.edit = i; render();
      requestAnimationFrame(() => { const ed = document.querySelector(".editor"); if (ed) { ed.scrollIntoView({ block: "center" }); $("#edText")?.focus(); } });
      break;
    }
    case "shEditToggle": S.shEdit = !S.shEdit; renderSheet(); if (S.shEdit) $("#shText")?.focus(); break;
    case "shEditSave": {
      const b = p.blocks[S.sheetIdx], v = $("#shText").value.trim(); if (!v) return;
      b.text = v; S.shEdit = false; savePlay(); render(); break;
    }
    case "rToggle":
      if (RUN.paused) runFrom(RUN.idx); else { halt(); RUN.paused = true; RUN.phase = ""; drawStage(); }
      break;
    case "rNext": jump(1); break;
    case "rPrev": jump(-1); break;
    case "doneTurn": RUN.skip?.(); break;
    case "stop": halt(); RUN.paused = false; $("#stage").hidden = true; releaseLock(); break;
  }
});
document.addEventListener("change", async e => {
  const t = e.target, p = S.play;
  if (t.id === "playSel") { S.msg = null; await selectPlay(S.plays.find(x => x.id === t.value)); }
  else if (t.id === "myName") {
    const n = t.value.trim().slice(0, 40); U.me.name = n; U.names[U.me.id] = { id: U.me.id, name: n }; setChip();
    sb.from("profiles").upsert({ id: U.me.id, name: n }).then(r => { if (r.error) { S.msg = { err: true, t: errText(r.error) }; render(); } });
    render();
  }
  else if (t.id === "titleIn") { p.title = t.value.trim() || "Sans titre"; savePlay(); render(); }
  else if (t.id === "voixSel") { S.voixWho = t.value; S.sheetIdx = -1; render(); }
  else if (t.id === "meSel") { p.settings.me = t.value; saveSettings(); render(); }
  else if (t.id === "showMine" || t.id === "tts" || t.id === "readDid") { p.settings[t.id] = t.checked; saveSettings(); }
  else if (t.id === "useRecDur") { p.settings.useRecDur = t.checked; saveSettings(); render(); }
  else if (t.id === "startSel" && t.value !== "") {
    const L = spokenIdx(), hi = +t.value; let pos = L.findIndex(j => j >= hi); if (pos < 0) pos = 0;
    setTlPos(pos); t.value = "";
  }
  else if (t.id === "tlRange") setTlPos(+t.value);
  else if (t.id === "spw") { p.settings.spw = +t.value; saveSettings(); render(); }
  else if (/^audio(File|File2|Cap)$/.test(t.id) && t.files[0]) { const f = t.files[0]; t.value = ""; await recordSave(f); }
  else if ((t.id === "pdfInput" || t.id === "pdfInput2") && t.files[0]) {
    const f = t.files[0]; t.value = "";
    S.msg = { t: "Lecture de « " + f.name + " »…" }; S.paste = false; render();
    try {
      let text, scanned = false;
      if (/\.(json|echorae|souffleur)$/i.test(f.name) || f.type === "application/json") { await importJSON(f); render(); return; }
      if (/\.txt$/i.test(f.name) || f.type === "text/plain") text = await f.text();
      else { const r = await pdfToText(f); text = r.text; scanned = r.chars / r.pages < 40; }
      if (scanned) { S.msg = { err: true, t: "Ce PDF ne contient presque pas de texte : c'est sans doute une page scannée (une image). Ouvre-le dans une appli qui fait la reconnaissance de texte (Google Lens, Notes sur iPhone…), copie le texte, puis utilise « Coller un texte »." }; render(); return; }
      const blocks = parseText(text);
      await newPlay(f.name.replace(/\.(pdf|txt)$/i, ""), blocks);
      const n = chars().length;
      S.msg = n ? { t: `Pièce lue : ${n} personnages, ${blocks.filter(b => b.type === "line").length} répliques, ${blocks.filter(b => b.type === "didasc").length} didascalies. Parcours le texte et touche une ligne pour la corriger.` }
               : { err: true, t: "Je n'ai pas trouvé de noms de personnages. Le texte est importé ; tu peux corriger les lignes à la main, ou vérifier que les noms sont en MAJUSCULES en début de réplique." };
    } catch (err) { S.msg = { err: true, t: "Impossible de lire ce fichier : " + (err.message || err) }; }
    render();
  }
});
/* Some Android pickers only fire "input": forward it once as "change" (the first handler clears the field). */
document.addEventListener("input", e => { const t = e.target; if (t.type === "file" && t.files && t.files[0]) t.dispatchEvent(new Event("change", { bubbles: true })); });
window.addEventListener("resize", () => { if (S.tab === "rep") drawTimeline(); });
window.addEventListener("error", e => { S.msg = { err: true, t: "Erreur de l'appli : " + (e.message || "inconnue") + ". Envoie ce message à Claude." }; try { render(); } catch (x) {} });
window.addEventListener("unhandledrejection", e => { const r = e.reason; S.msg = { err: true, t: "Erreur : " + errText(r) + ". Envoie ce message à Claude." }; try { render(); } catch (x) {} });
document.addEventListener("submit", async e => {
  if (e.target.id !== "loginForm") return;
  e.preventDefault();
  const email = $("#loginEmail").value.trim(), password = $("#loginPass").value;
  if (!sb) { S.msg = { err: true, t: "Impossible de joindre le serveur. Vérifie ta connexion Internet puis recharge la page." }; render(); return; }
  S.loggingIn = true; S.msg = null; render();
  const r = await sb.auth.signInWithPassword({ email, password }).catch(err => ({ error: err }));
  S.loggingIn = false;
  if (r.error || !r.data || !r.data.session) { S.msg = { err: true, t: errText(r.error) }; render(); $("#loginEmail").value = email; return; }
  LS.set("email", email); LS.set("mode", "cloud");
  await startCloud(r.data.session);
});
document.addEventListener("focusout", () => setTimeout(() => { if (softPending) softRender(); }, 0));
document.addEventListener("input", e => { if (e.target.id === "tlRange") tlPreview(+e.target.value); });
document.addEventListener("input", e => { if (e.target.id === "spw") { S.play.settings.spw = +e.target.value; } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#stage").hidden && !RUN.lock) lock(); });

/* ---------- fichier .souffleur.json : pièce découpée + voix ---------- */
const b64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
async function exportPlay() {
  const p = S.play; if (!p) return;
  S.msg = { t: "Préparation du fichier…" }; render();
  const voices = {};
  for (const b of p.blocks) { const k = p.id + ":" + b.id; if (!S.rec.has(k)) continue; const blob = await DB.get("audio", k); if (blob) voices[b.id] = { type: blob.type || "audio/mp4", data: await b64(blob) }; }
  const out = JSON.stringify({ format: "echorae", version: 1, title: p.title, blocks: p.blocks, voices });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], { type: "application/json" }));
  a.download = p.title.replace(/[^\p{L}\d]+/gu, "_").replace(/^_|_$/g, "") + ".echorae.json";
  document.body.appendChild(a); a.click(); a.remove();
  S.msg = { t: `Fichier créé avec ${Object.keys(voices).length} voix. Retrouve-le dans tes téléchargements.` }; render();
}
async function importJSON(f) {
  let d; try { d = JSON.parse(await f.text()); } catch (e) { throw new Error("ce fichier n'est pas un fichier Echorae."); }
  if (!d || !/^(echorae|souffleur)$/.test(d.format) || !Array.isArray(d.blocks)) throw new Error("ce fichier n'est pas un fichier Echorae.");
  const blocks = d.blocks.filter(b => b && b.text && /^(line|didasc|heading)$/.test(b.type)).map(b => ({ id: String(b.id || uid()), type: b.type, who: String(b.who || "").toUpperCase(), text: String(b.text) }));
  /* même pièce déjà présente ? on y ajoute seulement les voix */
  let p = S.plays.find(x => x.title === d.title && x.blocks && x.blocks.length === blocks.length && x.blocks.every((b, i) => b.id === blocks[i].id));
  const isNew = !p;
  if (isNew) p = await newPlay(d.title || f.name.replace(/\.((echorae|souffleur)\.)?json$/i, ""), blocks); else await selectPlay(p);
  let n = 0;
  for (const [id, v] of Object.entries(d.voices || {})) {
    const b = p.blocks.find(x => x.id === id); if (!b || !v || !v.data) continue;
    const bytes = Uint8Array.from(atob(v.data), c => c.charCodeAt(0));
    await saveAudio(b, new Blob([bytes], { type: v.type || "audio/mp4" }), p); n++;
  }
  S.msg = { t: `${isNew ? "Pièce importée" : "Voix ajoutées à la pièce existante"} : ${chars().length} personnages, ${p.blocks.filter(b => b.type === "line").length} répliques, ${n} voix.` };
}

/* ---------- boot ---------- */
async function startCloud(session) {
  const user = session.user;
  U.me = { id: user.id, email: user.email, name: "" };
  halt(); $("#stage").hidden = true;
  S.auth = null; S.cloud = true; S.cloudReady = false; S.booting = false; S.plays = []; S.play = null; S.rec = new Set(); S.msg = null;
  S.local = S.localPlays.filter(p => !LS.get("migrated:" + p.id) && (!/\(exemple\)/.test(p.title) || [...S.localRec].some(k => k.startsWith(p.id + ":"))));
  render();
  try {
    const prof = chk(await sb.from("profiles").select("name").eq("id", user.id).maybeSingle());
    U.me.name = (prof && prof.name) || ""; U.names[user.id] = { id: user.id, name: U.me.name };
    chk(await sb.from("prefs").select("play_id,settings")).forEach(r => U.prefs[r.play_id] = r.settings);
    setChip();
    await loadPlays();
  } catch (e) { S.cloudReady = true; S.msg = { err: true, t: errText(e) }; render(); }
  if (!C.chPlays) C.chPlays = sb.channel("plays").on("postgres_changes", { event: "*", schema: "public", table: "plays" }, () => { if (S.cloud) loadPlays().catch(() => {}); }).subscribe();
}
async function enterLocal() {
  S.booting = false; S.cloud = false; S.auth = null; setChip();
  S.plays = S.localPlays; S.rec = S.localRec;
  if (!S.plays.length) {
    await newPlay("Le Médecin malgré lui (exemple)", parseText(SAMPLE));
    S.msg = { t: "Une scène d'exemple de Molière est chargée pour essayer. Importe ton PDF pour travailler ta pièce." };
  } else { const last = LS.get("last"); S.play = S.plays.find(p => p.id === last) || S.plays[0]; }
  render();
}
async function signOut() {
  halt(); $("#stage").hidden = true;
  if (C.chPlays) { sb.removeChannel(C.chPlays); C.chPlays = null; }
  if (C.chVoices) { sb.removeChannel(C.chVoices); C.chVoices = null; }
  await sb.auth.signOut().catch(() => {});
  Object.assign(S, { cloud: false, cloudReady: false, plays: [], play: null, rec: new Set(), msg: null, auth: "login" });
  U.me = null; U.prefs = {}; C.urls.clear(); setChip(); render();
}
(async () => {
  render();
  await DB.open();
  S.localPlays = ((await DB.all("plays")) || []).sort((a, b) => (b.created || 0) - (a.created || 0));
  S.localPlays.forEach(p => p.settings = settingsFor(p.id, p.settings));
  S.localRec = new Set(((await DB.keys("audio")) || []).map(String));
  if (!window.supabase || !window.supabase.createClient) { S.offlineLib = true; if (LS.get("mode") === "local") return enterLocal(); S.booting = false; S.auth = "login"; render(); return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await sb.auth.getSession().catch(() => ({ data: {} }));
  if (data && data.session) return startCloud(data.session);
  if (LS.get("mode") === "local") return enterLocal();
  S.booting = false; S.auth = "login"; render();
})();
</script>
